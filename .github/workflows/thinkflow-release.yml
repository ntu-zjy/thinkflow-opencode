name: ThinkFlow Release

on:
  push:
    branches: [feat/sealos-deploy-auth, thinkflow-mvp1]
    paths:
      - "packages/thinkflow/**"
      - "packages/opencode/**"
      - ".github/workflows/thinkflow-release.yml"
  workflow_dispatch:

jobs:
  # ─── 单元测试 ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/thinkflow/app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bunx vitest run

  # ─── 构建并推送 Docker 镜像到 Docker Hub ──────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── OpenCode 服务镜像 ──────────────────────────────────────────────────
      - name: Build & push opencode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/thinkflow/Dockerfile.opencode
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/thinkflow-opencode:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/thinkflow-opencode:${{ github.sha }}
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=max,scope=opencode

      # ── 前端镜像（构建时注入 OpenCode 服务地址）────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/thinkflow/app/Dockerfile
          push: true
          build-args: |
            VITE_OPENCODE_SERVER_URL=${{ secrets.VITE_OPENCODE_SERVER_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/thinkflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/thinkflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── 桌面版构建（macOS）────────────────────────────────────────────────────
  build-desktop-macos:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    needs: test
    defaults:
      run:
        working-directory: packages/thinkflow
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install app dependencies
        run: bun install
        working-directory: packages/thinkflow/app

      - name: Install desktop dependencies
        run: bun install
        working-directory: packages/thinkflow/desktop

      - name: Build opencode-cli (macOS arm64)
        run: bun run script/build.ts --single
        working-directory: packages/opencode

      - name: Copy sidecar binary
        run: |
          mkdir -p desktop/src-tauri/sidecars
          cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode \
             packages/thinkflow/desktop/src-tauri/sidecars/opencode-cli-aarch64-apple-darwin
        working-directory: ${{ github.workspace }}

      - name: Build Tauri app
        run: bun tauri build
        working-directory: packages/thinkflow/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThinkFlow-macOS-arm64
          path: packages/thinkflow/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
