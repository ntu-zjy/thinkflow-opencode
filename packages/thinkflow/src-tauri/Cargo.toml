[package]
name = "thinkflow"
version = "0.1.0"
description = "ThinkFlow - Agent Native Content Creation Tool"
authors = ["ThinkFlow Team"]
license = "MIT"
repository = "https://github.com/thinkflow/thinkflow"
default-run = "thinkflow"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "thinkflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "thinkflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
