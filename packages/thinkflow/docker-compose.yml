version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: thinkflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thinkflow
      POSTGRES_PASSWORD: thinkflow_dev
      POSTGRES_DB: thinkflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  postgres_data:
